name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # The toolchains this job installs are the pinned ones documented in
  # docs/operations.md: LLVM 20 for the compiled leg, and a CPython at or above the
  # oracle pin for the conformance leg. They are pinned here rather than left to the
  # runner image because the conformance matrix asserts against CPython itself: when
  # CI ran ubuntu-22.04 (Python 3.10) the row for programs/typealias "drifted" from
  # match to not_applicable — `type Count = int` is PEP 695 syntax and 3.10 cannot
  # parse it, so the oracle leg died on line 1 and the note blamed the compiler.
  # Ubuntu 24.04 ships Python 3.12, which is the pin.
  test-on-ubuntu-with-llvm-20:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM 20
        # The key is fetched and dearmored as the runner user and only then installed
        # with sudo: `gpg --dearmor --output /etc/apt/keyrings/llvm.gpg` without sudo
        # cannot write into the root-owned keyring directory, and the failure arrives
        # three lines late as "no valid OpenPGP data found" / "dearmoring failed"
        # rather than where it happened. `pipefail` matters for the same reason — a
        # truncated download must not be masked by gpg's own exit status, and then
        # blamed on apt or on LLVM.
        run: |
          set -euo pipefail
          wget -q -O llvm-20.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          test -s llvm-20.asc
          gpg --dearmor --yes --output llvm-20.gpg llvm-20.asc
          test -s llvm-20.gpg
          sudo mkdir -p /etc/apt/keyrings
          sudo install -m 0644 llvm-20.gpg /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-20 llvm-20-dev
          # Fail in this step if the pinned toolchain is not actually on PATH: every
          # compiled leg below reads the matrix's toolchain.llvm from llc-20, and a
          # missing binary turns into a stack of "no toolchain found" skips that are
          # never allowed to count as passes.
          llc-20 --version | head -n 1

      # The Go floor is a declared dependency, not an accident of the runner image
      # (ADR 0194). It used to be 1.20 while development happened on 1.22, and that
      # skew is exactly what made a CI-only failure out of `strings.ContainsFunc`
      # (a Go 1.21 stdlib call): the `go` directive gates language features, not
      # stdlib API availability, so newer-than-floor calls type-check locally and
      # fail only in CI. The version here and the `go` line in go.mod are kept equal,
      # and the version step below prints what it actually got.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Toolchain versions (the matrix is only meaningful against these)
        run: |
          set -e
          echo "go:   $(go version)"
          echo "llc:  $(llc-20 --version | head -n1)"
          echo "python: $(python3 --version)"
          # Fail here, loudly, if the runner stopped providing the pinned oracle: a
          # matrix produced by an older CPython reports drift that is not the
          # compiler's, which is a worse signal than a red setup step.
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              sys.exit("oracle is %s; the corpus is validated against >= 3.12 (docs/operations.md)" % ".".join(map(str, sys.version_info[:3])))
          print("oracle satisfies the pin")
          PY
          # Same rule for the compiler floor: a version that is merely printed is
          # documentation, and a version that is checked is a contract. The skew
          # between a 1.20 CI floor and 1.22 development is what turned a legal-local
          # stdlib call into a red build (ADR 0194).
          go version | grep -Eq 'go1\.(2[2-9]|[3-9][0-9])' || { echo "Go is older than the declared 1.22 floor in go.mod"; exit 1; }
          echo "go satisfies the floor"

      - name: Build
        run: go build -tags=llvm20 ./...

      # The suite is subprocess-bound — nearly every case ends inside llc-20, cc, lli-20 or python3 —
      # so a serial run is a one-core run, and on this runner pkg/lang crossed go test's implicit
      # ten-minute budget with the suite two-thirds through (ADR 0313: the panic named the case that
      # happened to be running, not the suite that was too slow). testshards splits the cases over one
      # process per core; the split comes from `go test -list`, so coverage is not left to a pattern
      # nobody can test, and -json says what ran, how long, and what failed.
      #
      # Each shard carries its own -timeout: it is now a stated budget for one shard's cases rather
      # than go test's implicit one for everything, and with ADR 0312's per-call budgets a stuck tool
      # ends at the call instead of at the alarm.
      #
      # cmd/ and tools/ are named alongside pkg/ because they hold tests too (the CLI's exit-code and
      # toolchain-classification cases live in cmd/gustyc, the harness's own claims in
      # tools/testshards) — a unit step that lists only ./pkg/... leaves them unrun by any step.
      - name: Unit tests (sharded: one test process per core)
        run: go run ./tools/testshards -tags llvm20 -timeout 12m ./pkg/... ./cmd/... ./tools/...

      - name: Integration tests (execute generated code)
        # The same treatment: these cases compile real programs through llc-20 + cc and run them, which
        # is the expensive leg of the matrix, and they were measured at 376 s serially.
        run: go run ./tools/testshards -tags llvm20 -timeout 12m ./integration/...
        env:
          LLC: llc-20

      - name: Make integration flow (llc-20 + cc)
        run: make testllvmcode
        env:
          LLC: llc-20
